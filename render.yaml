# Render Blueprint — Bazi Engine 八字排盘引擎
# https://render.com/docs/blueprint-spec
# 连接 GitHub 仓库后，Render 会自动读取此文件部署

services:
  - type: web
    name: bazi-engine
    runtime: docker
    repo: https://github.com/jiwenxu025-boop/bazi-engine
    branch: main
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: BAZI_PUBLIC
        value: "true"
      - key: FRONTEND_DIR
        value: /app/frontend
      - key: BAZI_FUSION_ENGINE
        value: "0"
