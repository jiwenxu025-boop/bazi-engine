<!DOCTYPE html>
<html lang=zh-CN>
<head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>激活码管理</title>
<style>
body{font-family:monospace;max-width:800px;margin:20px auto;padding:0 16px;background:#1a1a2e;color:#e0e0e0}
h1{font-size:18px;border-bottom:1px solid #333;padding-bottom:8px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid #2a2a3e}
th{font-size:11px;color:#888;text-transform:uppercase}
td{font-size:13px}
.warn{color:#ff6b6b}.ok{color:#4ecdc4}.good{color:#45b7d1}
.summary{display:flex;gap:20px;margin:16px 0}
.summary div{background:#16213e;padding:12px 20px;border-radius:8px}
.summary .num{font-size:24px;font-weight:700;color:#4ecdc4}
.refresh{float:right;background:#4ecdc4;color:#1a1a2e;border:none;padding:6px 16px;border-radius:4px;cursor:pointer}
</style></head>
<body>
<h1>KEY 激活码管理 <button class=refresh id=refreshBtn>刷新</button></h1>
<div class=summary>
  <div>总码数<br><span class=num id=totalCodes>-</span></div>
  <div>总剩余次数<br><span class=num id=totalRemaining>-</span></div>
</div>
<table><thead><tr><th>激活码</th><th>剩余</th><th>备注</th></tr></thead><tbody id=tb></tbody></table>
<script>
let adminKey = sessionStorage.getItem('bazi-admin-key') || prompt('输入管理密钥');
if (adminKey) sessionStorage.setItem('bazi-admin-key', adminKey);

async function loadCodes(){
  let response = await fetch('/api/admin/codes', {headers: {'X-Admin-Key': adminKey || ''}});
  let data = await response.json();
  if (!response.ok) throw new Error(data.error || '加载失败');
  document.getElementById('totalCodes').textContent = data.total_codes;
  document.getElementById('totalRemaining').textContent = data.total_remaining;
  let table = document.getElementById('tb');
  table.replaceChildren();
  data.codes.forEach(c => {
    let row = document.createElement('tr');
    let code = document.createElement('td');
    let remaining = document.createElement('td');
    let note = document.createElement('td');
    code.textContent = c.code;
    remaining.textContent = c.remaining;
    remaining.className = c.remaining === 0 ? 'warn' : c.remaining <= 3 ? 'ok' : 'good';
    note.textContent = c.note || '';
    row.append(code, remaining, note);
    table.appendChild(row);
  });
}

document.getElementById('refreshBtn').addEventListener('click', () => loadCodes().catch(alert));
loadCodes().catch(alert);
</script>
</body></html>
